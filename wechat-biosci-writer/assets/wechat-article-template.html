<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="{{AUTHOR}}">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}}</title>
</head>
<body style="margin:0;background:#f5f7fa;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <main style="box-sizing:border-box;max-width:760px;margin:0 auto;padding:28px 20px 64px;background:#ffffff;">
    <header style="padding:4px 0 22px;border-bottom:1px solid #e5e7eb;">
      <h1 style="margin:0 0 12px;font-size:28px;line-height:1.35;letter-spacing:.01em;color:#111827;">{{TITLE}}</h1>
      <p style="margin:0;font-size:14px;line-height:1.7;color:#6b7280;">{{AUTHOR}}</p>
    </header>
    <article style="font-size:16px;line-height:1.82;word-break:break-word;">
      {{CONTENT}}
    </article>
  </main>
</body>
</html>
